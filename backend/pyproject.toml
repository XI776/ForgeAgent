[project]
name = "forgeagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1", "pydantic>=2.9,<3", "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7", "croniter>=3.0,<4",
]

[project.scripts]
forgeagent = "forge_agent.cli:main"
forgeagent-host = "forge_agent.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `pytest` (console script) does not add the current directory to sys.path the
# way `python -m pytest` does; make `forge_agent` importable in CI as well.
pythonpath = ["."]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
