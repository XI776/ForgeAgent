name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: python -m compileall -q forge_agent
        working-directory: backend
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forgeagent:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name forgeagent-ci -p 127.0.0.1:18765:8765 forgeagent:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18765/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18765/health
          curl -fsS http://127.0.0.1:18765/ | grep -q 'id="root"'
      - name: Show container logs
        if: always()
        run: docker logs forgeagent-ci || true
      - name: Remove container
        if: always()
        run: docker rm -f forgeagent-ci || true
